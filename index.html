<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>دعوتنامه اختصاصی نمایشگاه</title>
    <style>
      @keyframes splash-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Global splash screen (removed by the app once it is ready) -->
    <div id="global-splash" style="--splash-bg:#0f172a;--splash-accent:#38bdf8;position:fixed;inset:0;z-index:9999;background-color:var(--splash-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.7s;">
      <div style="position:relative;display:flex;flex-direction:column;align-items:center;">
        <div style="position:absolute;inset:-1rem;background-color:var(--splash-accent);border-radius:9999px;filter:blur(24px);opacity:0.15;animation:splash-pulse 2s ease-in-out infinite;"></div>
        <div style="width:2.5rem;height:2.5rem;border:4px solid rgba(100,116,139,.35);border-top-color:var(--splash-accent);border-radius:9999px;animation:splash-spin 1s linear infinite;"></div>
        <p style="margin-top:1rem;color:var(--splash-accent);font-weight:600;font-size:0.875rem;font-family:Vazirmatn, Tahoma, sans-serif;">در حال آماده‌سازی...</p>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
